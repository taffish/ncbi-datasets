[package]
name = "ncbi-datasets"
kind = "tool"
version = "18.35.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/ncbi-datasets"

[command]
name = "taf-ncbi-datasets"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/ncbi-datasets:18.35.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["genomics", "data-retrieval", "database-query", "metadata"]
keywords = ["NCBI Datasets", "datasets", "dataformat", "NCBI", "genome", "gene", "taxonomy", "virus", "metadata", "data package"]
description = "NCBI Datasets 18.35.0 CLI runtime for querying and downloading NCBI biological data packages and formatting their metadata."

[upstream]
name = "NCBI Datasets"
type = "github"
repo = "ncbi/datasets"
homepage = "https://www.ncbi.nlm.nih.gov/datasets/"
manual = "https://www.ncbi.nlm.nih.gov/datasets/docs/v2/command-line-tools/"
release_url = "https://github.com/ncbi/datasets/releases/tag/v18.35.0"
downloads = "https://github.com/ncbi/datasets/releases/download/v18.35.0/linux-amd64.cli.package.zip; https://github.com/ncbi/datasets/releases/download/v18.35.0/linux-arm64.cli.package.zip"
version = "18.35.0"
commit = "f637b91702b9c216dfa2c172a78bcc02e95df2bd"
license = "Public Domain / United States Government Work"
description = "NCBI command-line tools for retrieving gene, genome, taxonomy, and virus data packages and converting NCBI metadata reports to TSV or Excel."
citation = "O'Leary NA et al. Exploring and retrieving sequence and metadata for species across the tree of life with NCBI Datasets. Scientific Data. 2024;11:732."
doi = "10.1038/s41597-024-03571-y"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 120
exist = ["datasets", "dataformat", "sh", "grep", "sed", "wc", "tr", "head", "cut", "mkdir", "rm"]
test = ["datasets --version 2>&1 | grep -Fx 'datasets version: 18.35.0' >/dev/null && dataformat version 2>&1 | grep -Fx 'undefined' >/dev/null && grep -Fx 'upstream_version=18.35.0' /opt/ncbi-datasets/share/doc/ncbi-datasets/source.txt >/dev/null && test -s /etc/ssl/certs/ca-certificates.crt", "datasets --help 2>&1 | grep -F 'Data Retrieval Commands' >/dev/null && datasets summary genome accession --help 2>&1 | grep -F -- '--as-json-lines' >/dev/null && datasets download genome accession --help 2>&1 | grep -F -- '--dehydrated' >/dev/null && datasets download gene gene-id --help 2>&1 | grep -F 'include all file types' >/dev/null && datasets download virus genome taxon --help 2>&1 | grep -F 'include all reports and sequence data' >/dev/null && datasets rehydrate --help 2>&1 | grep -F -- '--directory' >/dev/null && dataformat --help 2>&1 | grep -F 'Formatting Commands' >/dev/null && dataformat tsv genome --help 2>&1 | grep -F -- '--fields' >/dev/null && dataformat tsv sequence --help 2>&1 | grep -F -- '--list-templates' >/dev/null && dataformat tsv sequence --list-templates 2>&1 | grep -F 'summary-no-query' >/dev/null && dataformat excel genome --help 2>&1 | grep -F -- '--outputfile' >/dev/null", "/opt/ncbi-datasets/share/testdata/ncbi-datasets-smoke.sh tsv", "/opt/ncbi-datasets/share/testdata/ncbi-datasets-smoke.sh sequence", "/opt/ncbi-datasets/share/testdata/ncbi-datasets-smoke.sh excel"]
